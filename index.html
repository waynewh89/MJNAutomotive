    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "@id": "https://mjnautomotive.au/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Can I request a service online?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. You can send a service request through the website and MJN Automotive will contact you to confirm availability, timing and any required details. Online requests are not confirmed bookings until the workshop confirms the appointment."
            }
          },
          {
            "@type": "Question",
            "name": "Do you provide logbook servicing in South Nowra?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. MJN Automotive provides logbook servicing for many makes and models. The workshop can follow the required service schedule and advise what is due before work begins."
            }
          },
          {
            "@type": "Question",
            "name": "Can an independent mechanic service my car without affecting warranty?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "In many cases, a qualified independent mechanic can complete scheduled servicing using suitable parts and procedures. If your vehicle is under warranty, MJN Automotive can discuss the service requirements before proceeding."
            }
          },
          {
            "@type": "Question",
            "name": "What are signs my brakes need attention?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Common signs include squealing, grinding, vibration when braking, a soft brake pedal, the vehicle pulling to one side, or a brake warning light. If you notice these symptoms, the vehicle should be inspected before the issue worsens."
            }
          },
          {
            "@type": "Question",
            "name": "Do you diagnose warning lights and fault codes?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. MJN Automotive can inspect warning lights, scan for fault codes and carry out further fault finding where required. A scan code is only a starting point, so the workshop may need to test related components before recommending repairs."
            }
          },
          {
            "@type": "Question",
            "name": "Do you service customers outside South Nowra?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. MJN Automotive is based in South Nowra and also helps customers from Nowra, Bomaderry, Worrigee, West Nowra, North Nowra and the wider Shoalhaven area."
            }
          },
          {
            "@type": "Question",
            "name": "Will you contact me before doing extra repair work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. If additional work is identified, MJN Automotive will explain the issue and seek approval before carrying out extra repairs."
            }
          },
          {
            "@type": "Question",
            "name": "What information should I include in a service request?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Include your name, contact details, vehicle make and model, registration if available, the issue or service required, and preferred timing. This helps the workshop respond with the right information."
            }
          }
        ]
